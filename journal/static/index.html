<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css?v=13" />
</head>
<body>
  <nav class="rail" id="rail">
    <a class="logo" href="#/home" title="Ledger"></a>
    <a href="#/home" data-route="home" title="Home">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
    </a>
    <a href="#/dashboard" data-route="dashboard" title="Dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v4h-7zM4 13h7v7H4zm9 6h7v-9h-7z"/></svg>
    </a>
    <a href="#/analytics" data-route="analytics" title="Analytics">
      <svg viewBox="0 0 24 24"><path d="M4 18h16v2H4zm2-3h3v-7H6zm5 0h3V5h-3zm5 0h3v-4h-3z"/></svg>
    </a>
    <a href="#/calendar" data-route="calendar" title="Calendar">
      <svg viewBox="0 0 24 24"><path d="M7 3h2v2h6V3h2v2h3v16H4V5h3zm12 6H5v10h14z"/></svg>
    </a>
    <a href="#/journal" data-route="journal" title="Journal">
      <svg viewBox="0 0 24 24"><path d="M7 3h11a2 2 0 0 1 2 2v14l-4-2-4 2-4-2-4 2V5a2 2 0 0 1 2-2h1z"/></svg>
    </a>
    <a href="#/rawdata" data-route="rawdata" title="Raw data">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v2.8H4zm0 5.6h16V13.4H4zM4 16.2h16V19H4z"/></svg>
    </a>
    <div class="rail-spacer"></div>
    <button type="button" id="syncBtn" class="rail-sync" title="从币安同步">
      <svg viewBox="0 0 24 24"><path d="M12 6V3L8 7l4 4V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-6z"/></svg>
    </button>
  </nav>
  <div class="stage">
    <header class="page-head">
      <h1 id="pageTitle">Home</h1>
      <div class="head-actions">
        <div class="range-picker" id="rangePicker">
          <button type="button" class="range-btn" id="rangeBtn">All time</button>
          <div class="range-menu" id="rangeMenu" hidden>
            <button type="button" data-range="all">All time</button>
            <button type="button" data-range="ytd">Year to date</button>
            <button type="button" data-range="90d">Last 90 days</button>
            <button type="button" data-range="30d">Last 30 days</button>
            <button type="button" data-range="7d">Last 7 days</button>
            <button type="button" data-range="today">Today</button>
            <button type="button" data-range="custom">Custom range</button>
            <div class="range-custom" id="rangeCustom" hidden>
              <input type="date" id="rangeFrom" />
              <span>→</span>
              <input type="date" id="rangeTo" />
              <button type="button" class="btn" id="rangeApply">Apply</button>
            </div>
          </div>
        </div>
        <button type="button" class="privacy-btn" id="privacyBtn" aria-pressed="false" title="Hide Balances">
          <svg class="ico-hide" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5C7 5 2.73 8.11 1.15 12 2.73 15.89 7 19 12 19s9.27-3.11 10.85-7C21.27 8.11 17 5 12 5zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5zm0-7A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5z"/>
          </svg>
          <svg class="ico-show" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.1 3.51 3.51 2.1l18.39 18.39-1.41 1.41-3.26-3.26A12.2 12.2 0 0 1 12 19C7 19 2.73 15.89 1.15 12a13.6 13.6 0 0 1 4.55-4.74L2.1 3.51zM12 7c3.7 0 7.05 2.22 8.85 5a11.7 11.7 0 0 1-3.08 3.23l-1.5-1.5A4.48 4.48 0 0 0 12 7.5c-.42 0-.83.06-1.21.17L9.19 6.07C10.08 6.24 11.02 7 12 7zm.9 3.32 2.78 2.78A2.5 2.5 0 0 0 12.9 10.32z"/>
          </svg>
          <span id="privacyLabel">Hide Balances</span>
        </button>
        <span id="syncHint" class="hint">Manual sync</span>
      </div>
    </header>
    <div class="page-progress" id="pageProgress" aria-hidden="true"><span></span></div>
    <main id="app"></main>
  </div>
  <script src="/app.js?v=13"></script>
</body>
</html>
